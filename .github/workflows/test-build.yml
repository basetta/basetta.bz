name: Test build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Astro build, regression and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check, build and run regression tests
        run: npm run verify
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test browser behavior and responsive heading styles
        id: browser
        run: npm run test:browser -- --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload browser failure report and traces
        if: ${{ failure() && steps.browser.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Verify deploy-preview indexing rules
        run: npm run build && npm test
        env:
          CONTEXT: deploy-preview
