[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "24.13.0"

# Internal links remain relative in previews; canonical URLs point to production.
# Astro uses Netlify's CONTEXT to mark previews noindex and block robots.txt.

[[redirects]]
from = "/blog/page/1/"
to = "/blog/"
status = 301

[[headers]]
for = "/*"
  [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  X-Frame-Options = "DENY"
